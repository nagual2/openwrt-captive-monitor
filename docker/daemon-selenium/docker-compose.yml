version: '3.8'

services:
  captive-daemon:
    image: captive-portal-daemon:latest
    container_name: captive-daemon
    restart: unless-stopped
    
    # Сетевой режим host для доступа к локальной сети (рекомендуется для captive portal)
    network_mode: host
    
    # Размер общей памяти (важно для Chromium)
    shm_size: '1gb'
    
    # Переменные окружения
    environment:
      - TZ=Europe/Berlin
      - CHECK_INTERVAL=60
      - LOG_LEVEL=INFO
      - COOKIES_FILE=/var/lib/captive-portal/cookies.pkl
    
    # Монтирование данных и логов
    volumes:
      - ./logs:/var/log
      - ./data:/var/lib/captive-portal
    
    # Ограничения ресурсов (Selenium + Chrome требуют больше памяти)
    # 512m - минимум, 1g+ - рекомендуется для стабильной работы Chromium
    deploy:
      resources:
        limits:
          memory: 1024m
          cpus: '0.8'
        reservations:
          memory: 256m
    
    # Логирование
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
