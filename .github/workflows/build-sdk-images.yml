name: Build SDK Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'docker/sdk/Dockerfile'
      - 'docker/sdk/.dockerignore'
      - '.github/workflows/build-sdk-images.yml'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all images'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Weekly rebuild on Sundays at 2 AM UTC to get base image updates
    - cron: '0 2 * * 0'

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openwrt-sdk

jobs:
  build-sdk-images:
    name: Build SDK Image (${{ matrix.target }}/${{ matrix.subtarget }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # All 8 supported architectures for release builds
          - openwrt_version: '23.05.5'
            target: 'x86'
            subtarget: '64'
            sdk_slug: 'x86-64'
          - openwrt_version: '23.05.5'
            target: 'ath79'
            subtarget: 'generic'
            sdk_slug: 'ath79-generic'
          - openwrt_version: '23.05.5'
            target: 'ramips'
            subtarget: 'mt76x8'
            sdk_slug: 'ramips-mt76x8'
          - openwrt_version: '23.05.5'
            target: 'mediatek'
            subtarget: 'filogic'
            sdk_slug: 'mediatek-filogic'
          - openwrt_version: '23.05.5'
            target: 'ipq40xx'
            subtarget: 'generic'
            sdk_slug: 'ipq40xx-generic'
          - openwrt_version: '23.05.5'
            target: 'ipq806x'
            subtarget: 'generic'
            sdk_slug: 'ipq806x-generic'
          - openwrt_version: '23.05.5'
            target: 'bcm27xx'
            subtarget: 'bcm2711'
            sdk_slug: 'bcm27xx-bcm2711'
          - openwrt_version: '23.05.5'
            target: 'rockchip'
            subtarget: 'armv8'
            sdk_slug: 'rockchip-armv8'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        run: |
          set -euo pipefail
          
          # Generate short SHA for tagging
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          
          # Generate image tags
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAG_LATEST="${IMAGE_BASE}:${{ matrix.openwrt_version }}-${{ matrix.sdk_slug }}-latest"
          TAG_SHA="${IMAGE_BASE}:${{ matrix.openwrt_version }}-${{ matrix.sdk_slug }}-${SHORT_SHA}"
          
          # Output for next steps
          {
            echo "short_sha=${SHORT_SHA}"
            echo "tag_latest=${TAG_LATEST}"
            echo "tag_sha=${TAG_SHA}"
            echo "image_base=${IMAGE_BASE}"
          } >> "$GITHUB_OUTPUT"
          
          echo "Image tags:"
          echo "  - ${TAG_LATEST}"
          echo "  - ${TAG_SHA}"

      - name: Check if image exists
        id: check_image
        continue-on-error: true
        run: |
          set -euo pipefail
          
          # Check if the latest tag exists
          if docker manifest inspect "${{ steps.meta.outputs.tag_latest }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${{ steps.meta.outputs.tag_latest }} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image ${{ steps.meta.outputs.tag_latest }} does not exist"
          fi

      - name: Build and push Docker image
        if: steps.check_image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true' || github.event_name == 'schedule'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sdk/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_latest }}
            ${{ steps.meta.outputs.tag_sha }}
          build-args: |
            UBUNTU_VERSION=24.04
            OPENWRT_VERSION=${{ matrix.openwrt_version }}
            SDK_TARGET=${{ matrix.target }}
            SDK_SUBTARGET=${{ matrix.subtarget }}
          labels: |
            org.opencontainers.image.title=OpenWrt SDK ${{ matrix.openwrt_version }}
            org.opencontainers.image.description=OpenWrt SDK ${{ matrix.openwrt_version }} for ${{ matrix.target }}/${{ matrix.subtarget }}
            org.opencontainers.image.version=${{ matrix.openwrt_version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.vendor=openwrt-captive-monitor
            openwrt.version=${{ matrix.openwrt_version }}
            openwrt.target=${{ matrix.target }}
            openwrt.subtarget=${{ matrix.subtarget }}
            openwrt.sdk_slug=${{ matrix.sdk_slug }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.tag_latest }}
          cache-to: type=inline
          provenance: false

      - name: Check out repository for validation scripts
        if: steps.check_image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true' || github.event_name == 'schedule'
        uses: actions/checkout@v6

      - name: Validate image size
        if: steps.check_image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true' || github.event_name == 'schedule'
        run: |
          set -euo pipefail
          
          chmod +x scripts/validate-docker-image-size.sh
          ./scripts/validate-docker-image-size.sh "${{ steps.meta.outputs.tag_latest }}" 3072

      - name: Validate image contents
        if: steps.check_image.outputs.exists != 'true' || github.event.inputs.force_rebuild == 'true' || github.event_name == 'schedule'
        run: |
          set -euo pipefail
          
          chmod +x scripts/validate-docker-image-contents.sh
          ./scripts/validate-docker-image-contents.sh "${{ steps.meta.outputs.tag_latest }}"

      - name: Build summary
        if: always()
        run: |
          set -euo pipefail
          
          {
            echo "## 🐳 SDK Image Build Summary"
            echo ""
            echo "**Target:** ${{ matrix.target }}/${{ matrix.subtarget }}"
            echo "**OpenWrt Version:** ${{ matrix.openwrt_version }}"
            echo "**Short SHA:** ${{ steps.meta.outputs.short_sha }}"
            echo ""
            echo "### 📦 Image Tags"
            echo "- \`${{ steps.meta.outputs.tag_latest }}\`"
            echo "- \`${{ steps.meta.outputs.tag_sha }}\`"
            echo ""
            
            if [[ "${{ steps.check_image.outputs.exists }}" == "true" ]] && \
               [[ "${{ github.event.inputs.force_rebuild }}" != "true" ]] && \
               [[ "${{ github.event_name }}" != "schedule" ]]; then
              echo "### ℹ️ Status"
              echo "Image already exists, skipped build"
            else
              echo "### ✅ Status"
              echo "Image built and pushed successfully"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Build Summary
    runs-on: ubuntu-24.04
    needs: build-sdk-images
    if: always()
    permissions:
      contents: read

    steps:
      - name: Generate summary
        run: |
          set -euo pipefail
          
          {
            echo "## 📊 Overall Build Summary"
            echo ""
            echo "**Workflow:** ${{ github.workflow }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo "**Branch:** ${{ github.ref_name }}"
            echo "**Commit:** ${{ github.sha }}"
            echo ""
            echo "### 🎯 Built Images"
            echo ""
            echo "All 8 architecture images have been processed:"
            echo "- x86/64"
            echo "- ath79/generic"
            echo "- ramips/mt76x8"
            echo "- mediatek/filogic"
            echo "- ipq40xx/generic"
            echo "- ipq806x/generic"
            echo "- bcm27xx/bcm2711"
            echo "- rockchip/armv8"
            echo ""
            echo "Images are available at: \`ghcr.io/${{ github.repository_owner }}/openwrt-sdk\`"
          } >> "$GITHUB_STEP_SUMMARY"
