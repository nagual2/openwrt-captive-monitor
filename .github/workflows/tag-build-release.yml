# Test merge commit

name: Tag Build Release

on:
  workflow_dispatch:
  # Disabled: Use Simple Release Build instead for universal packages
  # push:
  #   tags:
  #     - 'v[0-9][0-9][0-9][0-9].[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-packages:
    name: Build OpenWrt Packages (${{ matrix.sdk_target }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    
    # Use pre-built SDK Docker image from GHCR
    container:
      image: ghcr.io/${{ github.repository_owner }}/openwrt-sdk:${{ matrix.openwrt_version }}-${{ matrix.sdk_slug }}-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          # Universal package (arch: all) - only needs one SDK build
          - openwrt_version: '23.05.5'
            target: 'x86'
            subtarget: '64'
            arch: 'all'
            sdk_slug: 'x86-64'
            sdk_target: 'x86/64'

    steps:
      - name: Retry pull SDK image if needed
        if: failure()
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          # Retry logic for pulling the SDK image (up to 3 attempts)
          IMAGE="ghcr.io/${{ github.repository_owner }}/openwrt-sdk:${{ matrix.openwrt_version }}-${{ matrix.sdk_slug }}-latest"
          MAX_RETRIES=3
          RETRY_DELAY=10
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES to pull image: $IMAGE"
            if docker pull "$IMAGE"; then
              echo "Successfully pulled image"
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Pull failed, waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done
          
          echo "Failed to pull image after $MAX_RETRIES attempts"
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set build environment
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Prefer an 8-character short SHA for artifact naming consistency
          resolved_sha="${GITHUB_SHA:-}"
          if [ -z "$resolved_sha" ]; then
            resolved_sha=$(git rev-parse HEAD 2> /dev/null || echo nogit)
          fi
          short_sha=$(echo "$resolved_sha" | cut -c1-8)
          tag_name="${GITHUB_REF_NAME:-}"
          if [ -z "$tag_name" ]; then
            tag_name=$(git describe --tags --exact-match 2> /dev/null || echo "untagged")
          fi
          {
            echo "BUILD_NAME=tag-${tag_name}"
            echo "SHORT_SHA=${short_sha}"
            echo "TAG_NAME=${tag_name}"
          } >> "$GITHUB_ENV"
          echo "Using BUILD_NAME=tag-${tag_name} (sha=${short_sha})"

      - name: Prepare package for SDK build
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          # SDK is already available in /opt/openwrt-sdk from the container
          cd /opt/openwrt-sdk

          # Find and copy package directory
          WS="${{ github.workspace }}"
          PKG_NAME="openwrt-captive-monitor"
          if [ -d "$WS/package/$PKG_NAME" ]; then
            PKG_SRC="$WS/package/$PKG_NAME"
          elif [ -d "/__w/$PKG_NAME/$PKG_NAME/package/$PKG_NAME" ]; then
            PKG_SRC="/__w/$PKG_NAME/$PKG_NAME/package/$PKG_NAME"
          else
            echo "ERROR: Cannot find package source"
            find / -name "$PKG_NAME" -type d 2>/dev/null | head -10
            exit 1
          fi

          echo "Copying package from: $PKG_SRC"
          cp -r "$PKG_SRC" package/

          # Configure build
          make defconfig

          echo "SDK prepared for building"

      - name: Build package with SDK
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          cd /opt/openwrt-sdk
          
          # Build the package with verbose output
          make package/openwrt-captive-monitor/compile V=s BUILD_LOG=1
          
          # Create artifacts directory
          mkdir -p "${{ github.workspace }}/artifacts/${BUILD_NAME}"
          
          # Copy built packages to artifacts directory
          find bin/packages -name "openwrt-captive-monitor*.ipk" -exec cp -v {} "${{ github.workspace }}/artifacts/${BUILD_NAME}/" \;
          
          echo "Package built successfully"

      - name: List and validate produced artifacts
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          ART_DIR="${{ github.workspace }}/artifacts/${BUILD_NAME}"
          echo "Artifacts directory: $ART_DIR"

          if [ ! -d "$ART_DIR" ]; then
            echo "ERROR: Artifact directory not found: $ART_DIR"
            exit 1
          fi

          ls -la "$ART_DIR"
          echo "IPK files:"

          # Robust IPK discovery with quoted paths and existence checks
          IPK_COUNT=0

          # Top-level .ipk files
          for ipk in "$ART_DIR"/*.ipk; do
            [ -e "$ipk" ] || continue
            basename "$ipk"
            IPK_COUNT=$((IPK_COUNT + 1))
          done

          # One-level-deep .ipk files (shouldn't be needed with new structure)
          for dir in "$ART_DIR"/*; do
            [ -e "$dir" ] || continue
            for f in "$dir"/*.ipk; do
              [ -e "$f" ] || continue
              basename "$f"
              IPK_COUNT=$((IPK_COUNT + 1))
            done
          done

          if [ "$IPK_COUNT" -eq 0 ]; then
            echo "error: no .ipk files found in $ART_DIR" >&2
            exit 1
          fi

      - name: Setup opkg-utils
        run: |
          cd "${{ github.workspace }}"
          sh ./scripts/setup-opkg-utils.sh

      - name: Verify package internals
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          cd "${{ github.workspace }}"
          ART_DIR="artifacts/${BUILD_NAME}"
          
          # Find .ipk file
          IPK_FILE=""
          for ipk_pattern in "$ART_DIR"/openwrt-captive-monitor_*.ipk; do
            if [ -e "$ipk_pattern" ]; then
              IPK_FILE="$ipk_pattern"
              break
            fi
          done

          if [ -z "$IPK_FILE" ]; then
            echo "error: no openwrt-captive-monitor package found" >&2
            exit 1
          fi
          
          echo "Verifying package: $IPK_FILE"
          ./scripts/verify_package.sh "$IPK_FILE"

      - name: Validate IPK version metadata
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          cd "${{ github.workspace }}"
          fi
          
          echo "=== Validating Version field in .ipk control metadata ==="
          for IPK_FILE in artifacts/${BUILD_NAME}/*.ipk; do
            if [ ! -e "$IPK_FILE" ]; then
              echo "warning: no .ipk files found" >&2
              continue
            fi
            echo ""
            echo "Validating: $(basename "$IPK_FILE")"
            ./scripts/validate-ipk-version.sh "$IPK_FILE" "release"
          done
          echo ""
          echo "All packages validated successfully"

      - name: Stage package artifacts with SHA256SUMS
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          cd "${{ github.workspace }}"
          ./scripts/stage-package-artifacts.sh "artifacts/${BUILD_NAME}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v5
        with:
          name: captive-monitor-${{ matrix.sdk_target }}+${{ env.SHORT_SHA }}
          path: package
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: Build summary
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          
          cd "${{ github.workspace }}"
          {
            echo "## 📦 Build Summary"
            echo ""
            echo "**Build Method:** Docker SDK Image"
            echo "**SDK Image:** ghcr.io/${{ github.repository_owner }}/openwrt-sdk:${{ matrix.openwrt_version }}-${{ matrix.sdk_slug }}-latest"
            echo "**Tag:** ${{ env.TAG_NAME }}"
            echo "**Target:** ${{ matrix.sdk_target }}"
            echo "**Architecture:** ${{ matrix.arch }}"
            echo "**OpenWrt Version:** ${{ matrix.openwrt_version }}"
            echo "**Short SHA:** ${{ env.SHORT_SHA }}"
            echo ""
            echo "### 📋 Generated Packages"
            find "artifacts/${BUILD_NAME}" -name "*.ipk" -exec basename {} \; | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build-packages
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Prepare aggregated package directory
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          ARTIFACTS_ROOT="artifacts"

          if [ ! -d "$ARTIFACTS_ROOT" ]; then
            echo "❌ artifacts directory not found at $ARTIFACTS_ROOT"
            ls -la
            exit 1
          fi

          mkdir -p package
          ipk_count=0

          for dir in "$ARTIFACTS_ROOT"/*; do
            [ -d "$dir" ] || continue
            echo "Processing artifacts from $dir"
            for ipk in "$dir"/*.ipk; do
              [ -f "$ipk" ] || continue
              cp -v "$ipk" package/
              ipk_count=$((ipk_count + 1))
            done
          done

          if [ "$ipk_count" -eq 0 ]; then
            echo "❌ no .ipk files found under $ARTIFACTS_ROOT" >&2
            find "$ARTIFACTS_ROOT" -maxdepth 2 -type f | sed 's/^/  - /'
            exit 1
          fi

          echo "Aggregated $ipk_count .ipk file(s) into package/"

          cd package
          if command -v sha256sum > /dev/null 2>&1; then
            sha256sum ./*.ipk > SHA256SUMS
          elif command -v shasum > /dev/null 2>&1; then
            shasum -a 256 ./*.ipk > SHA256SUMS
          else
            echo "❌ neither sha256sum nor shasum found" >&2
            exit 1
          fi

          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Install GitHub CLI
        uses: ./.github/actions/setup-system-packages
        with:
          packages: gh

      - name: Create or update GitHub Release with package assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          TAG="${GITHUB_REF_NAME:-}"
          if [ -z "$TAG" ]; then
            echo "❌ Unable to determine tag name from GITHUB_REF_NAME"
            exit 1
          fi

          if ! ls package/*.ipk > /dev/null 2>&1; then
            echo "❌ No .ipk files found in package/; refusing to create an empty release"
            exit 1
          fi

          # Create the release if it does not already exist
          RELEASE_ID=$(gh release view "$TAG" --json id --jq '.id' 2> /dev/null || echo "")
          if [ -z "$RELEASE_ID" ]; then
            echo "ℹ️  Creating GitHub Release for tag $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated release for $TAG" \
              --latest
          else
            echo "ℹ️  GitHub Release for tag $TAG already exists (id=$RELEASE_ID); uploading assets"
          fi

          echo "Uploading package assets (.ipk and SHA256SUMS) to release $TAG"
          files=(package/*.ipk)
          if [ -f package/SHA256SUMS ]; then
            files+=(package/SHA256SUMS)
          fi
          printf '  + %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Release summary
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          {
            echo "## Release summary"
            echo ""
            echo "Tag: $TAG"
            echo "Attached assets:"
            ls -1 package
          } >> "$GITHUB_STEP_SUMMARY"
