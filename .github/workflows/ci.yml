name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Makefile'
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      matrix:
        linter:
          - shfmt
          - shellcheck
          - markdownlint
          - actionlint
          - yamllint

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache linting tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/shfmt
            ~/.cache/shellcheck
            ~/.cache/actionlint
          key: ${{ runner.os }}-lint-tools-${{ matrix.linter }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-lint-tools-${{ matrix.linter }}-
            ${{ runner.os }}-lint-tools-

      - name: Install base dependencies
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar

      - name: Install linter dependencies
        if: matrix.linter == 'shfmt' || matrix.linter == 'shellcheck'
        uses: ./.github/actions/setup-system-packages
        with:
          packages: busybox shfmt shellcheck

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          check-latest: true

      - name: Show Node.js version
        run: node --version

      - name: Install yamllint
        if: matrix.linter == 'yamllint'
        uses: ./.github/actions/setup-system-packages
        with:
          packages: yamllint

      - name: Run yamllint
        if: matrix.linter == 'yamllint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          yamllint -d "{extends: relaxed, rules: {truthy: disable}}" \
            .github/workflows/ci.yml

      - name: Run shfmt
        if: matrix.linter == 'shfmt'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Exclude init.d scripts as they use tabs and OpenWrt-specific functions
          # Skip temporary and build directories to avoid formatting generated files
          find . \( -name '*.sh' -o -type f -executable \) \
            -not -path '*/.git/*' \
            -not -path '*/tmp/*' \
            -not -path '*/.tmp/*' \
            -not -path '*/build/*' \
            -not -path '*/package/*/files/etc/init.d/*' | \
            xargs -r shfmt -d -s -i 4 -ci -sr

      - name: Run shellcheck
        if: matrix.linter == 'shellcheck'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Exclude .git and init.d scripts
          find . \( -path './.git' -o -path './package/*/files/etc/init.d' \) -prune -o \
            -type f -name "*.sh" -print | \
            xargs -r shellcheck
          shellcheck openwrt_captive_monitor.sh

      - name: Run markdownlint
        if: matrix.linter == 'markdownlint'
        uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          config: '.markdownlint.json'
          files: '**/*.md'

      - name: Download actionlint
        if: matrix.linter == 'actionlint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Download a pinned version of actionlint into the runner temp directory
          ACTIONLINT_VERSION="1.7.1"
          ACTIONLINT_DIR="${RUNNER_TEMP:-/tmp}/actionlint"
          mkdir -p "$ACTIONLINT_DIR"
          curl -sSfL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$ACTIONLINT_DIR"
          # Expose the actionlint binary path to subsequent steps via GITHUB_ENV
          echo "ACTIONLINT_BIN=${ACTIONLINT_DIR}/actionlint" >> "$GITHUB_ENV"

      - name: Run actionlint
        if: matrix.linter == 'actionlint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Lint only workflow YAML files and respect ignore rules for temporary/build directories
          # The .actionlintignore file and -ignore patterns ensure tmp/ and build/ trees are skipped.
          "${ACTIONLINT_BIN}" -color -shellcheck= -pyflakes= \
            -ignore '.*\/tmp\/.*' \
            -ignore '.*\/\.tmp\/.*' \
            -ignore '.*\/build\/.*' \
            .github/workflows/*.yml

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/test-deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('tests/**') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-

      - name: Install test dependencies
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar busybox

      - name: Run test harness with BusyBox ash
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          busybox ash tests/run.sh

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: tests/_out/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

  build-dev-package:
    name: Build Dev Package
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Build once for arch-independent package (PKG_ARCH:=all)
        # This package contains only shell scripts and configs, no compiled binaries
        include:
          - openwrt_version: '23.05.5'
            target: 'x86'
            subtarget: '64'
            arch: 'all'
            sdk_slug: 'x86_64'
            sdk_target: 'x86/64'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: ${{ runner.os }}-openwrt-sdk-${{ matrix.sdk_slug }}-${{ matrix.openwrt_version }}
          restore-keys: |
            ${{ runner.os }}-openwrt-sdk-${{ matrix.sdk_slug }}-
            ${{ runner.os }}-openwrt-sdk-

      - name: Set dev build environment
        id: build-env
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Prefer an 8-character short SHA for artifact naming consistency
          resolved_sha="${GITHUB_SHA:-}"
          if [ -z "$resolved_sha" ]; then
            resolved_sha=$(git rev-parse HEAD 2> /dev/null || echo nogit)
          fi
          short_sha=$(echo "$resolved_sha" | cut -c1-8)
          {
            echo "BUILD_NAME=dev-main"
            echo "SHORT_SHA=${short_sha}"
          } >> "$GITHUB_ENV"
          echo "Using BUILD_NAME=dev-main (artifact suffix: +${short_sha})"

      - name: Prepare package structure for SDK
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Create the expected package structure for the SDK action
          mkdir -p feed/package
          cp -r package/openwrt-captive-monitor feed/package/
          # Create artifacts directory
          mkdir -p "artifacts/${BUILD_NAME}"

          # Ensure a placeholder feeds.conf.default exists for the SDK action to patch
          # The openwrt/gh-action-sdk action expects this file under FEED_DIR and will
          # inject the local src-link feed path at runtime. Upstream feeds are not required
          # for this package build.
          if [ ! -f feed/feeds.conf.default ]; then
            {
              echo "# Placeholder feeds.conf.default for SDK action"
              echo "# The action will inject: src-link ${FEEDNAME:-local} <resolved-path>"
            } > feed/feeds.conf.default
          fi

          echo "Prepared package structure:"
          find feed -type f -name "Makefile" | head -5

          # Initialize git repo in feed to avoid SDK format check errors
          cd feed
          git init
          git config user.email "ci@openwrt-captive-monitor"
          git config user.name "CI Bot"
          git add .
          git commit -m "Initial commit" || true
          cd ..


      - name: Build with OpenWrt SDK (${{ matrix.sdk_target }})
        uses: openwrt/gh-action-sdk@v9
        env:
          # Use the official SDK container pinned to the OpenWrt version and target
          # e.g., x86-64-23.05.5
          ARCH: ${{ matrix.sdk_slug }}-${{ matrix.openwrt_version }}
          # Package(s) to build inside the SDK
          PACKAGES: openwrt-captive-monitor
          # Feed configuration - use default feeds plus our local feed
          FEEDNAME: local
          # Mount points for the action
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/${{ env.BUILD_NAME }}
          FEED_DIR: ${{ github.workspace }}/feed
          # Skip format checks - init scripts are already formatted with tabs
          NO_CHECK_FORMAT: 1

      - name: Copy SDK outputs to artifacts directory
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          ART_DIR="artifacts/${BUILD_NAME}"
          echo "Copying SDK outputs to $ART_DIR"

          # Find and copy .ipk files from SDK bin/packages directory
          find . -path "*/bin/packages/*/*.ipk" -type f -exec cp -Lv {} "$ART_DIR/" \;

          echo "Contents of $ART_DIR after copy:"
          ls -la "$ART_DIR"

      - name: List and validate produced artifacts
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          ART_DIR="artifacts/${BUILD_NAME}"
          echo "Artifacts directory: $ART_DIR"

          if [ ! -d "$ART_DIR" ]; then
            echo "ERROR: Artifact directory not found: $ART_DIR"
            exit 1
          fi

          ls -la "$ART_DIR"
          echo "IPK files:"

          # Robust IPK discovery with quoted paths and existence checks
          IPK_COUNT=0

          # Top-level .ipk files
          for ipk in "$ART_DIR"/*.ipk; do
            [ -e "$ipk" ] || continue
            basename "$ipk"
            IPK_COUNT=$((IPK_COUNT + 1))
          done

          # One-level-deep .ipk files
          for dir in "$ART_DIR"/*; do
            [ -e "$dir" ] || continue
            for f in "$dir"/*.ipk; do
              [ -e "$f" ] || continue
              basename "$f"
              IPK_COUNT=$((IPK_COUNT + 1))
            done
          done

          if [ "$IPK_COUNT" -eq 0 ]; then
            echo "error: no .ipk files found in $ART_DIR" >&2
            exit 1
          fi

      - name: Install verification tools
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar

      - name: Verify package internals
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Robust IPK discovery with quoted paths and existence checks
          IPK_FILE=""
          for ipk_pattern in \
            "artifacts/${BUILD_NAME}"/openwrt-captive-monitor_*.ipk; do
            if [ -e "$ipk_pattern" ]; then
              IPK_FILE="$ipk_pattern"
              break
            fi
          done

          if [ -z "$IPK_FILE" ]; then
            echo "error: no openwrt-captive-monitor package found" >&2
            exit 1
          fi
          echo "Verifying package: $IPK_FILE"
          ./scripts/verify_package.sh "$IPK_FILE"

      - name: Validate IPK version metadata
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          echo "=== Validating Version field in .ipk control metadata ==="
          for IPK_FILE in "artifacts/${BUILD_NAME}"/*.ipk; do
            if [ ! -e "$IPK_FILE" ]; then
              echo "warning: no .ipk files found" >&2
              continue
            fi
            echo ""
            echo "Validating: $(basename "$IPK_FILE")"
            # Validate Version field for main branch dev builds (context='main')
            ./scripts/validate-ipk-version.sh "$IPK_FILE" "main"
          done
          echo ""
          echo "All packages validated successfully"

      - name: Stage package artifacts with SHA256SUMS
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          ./scripts/stage-package-artifacts.sh "artifacts/${BUILD_NAME}"

      - name: Upload dev artifacts
        uses: actions/upload-artifact@v5
        with:
          name: captive-monitor-${{ matrix.sdk_target }}-dev+${{ env.SHORT_SHA }}
          path: package
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Build summary
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          {
            echo "## 📦 Dev Build Summary"
            echo ""
            echo "**Target:** ${{ matrix.sdk_target }}"
            echo "**Architecture:** ${{ matrix.arch }}"
            echo "**OpenWrt Version:** ${{ matrix.openwrt_version }}"
            echo "**Short SHA:** ${{ env.SHORT_SHA }}"
            echo ""
            echo "### 📋 Generated Packages"
            find "artifacts/${BUILD_NAME}" -name "*.ipk" -exec echo "- {}" \;
          } >> "$GITHUB_STEP_SUMMARY"

  build-pr-package:
    name: Build PR Package
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Build once for arch-independent package (PKG_ARCH:=all)
        # This package contains only shell scripts and configs, no compiled binaries
        include:
          - openwrt_version: '23.05.5'
            target: 'x86'
            subtarget: '64'
            arch: 'all'
            sdk_slug: 'x86_64'
            sdk_target: 'x86/64'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache OpenWrt SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/openwrt-sdk
          key: ${{ runner.os }}-openwrt-sdk-${{ matrix.sdk_slug }}-${{ matrix.openwrt_version }}
          restore-keys: |
            ${{ runner.os }}-openwrt-sdk-${{ matrix.sdk_slug }}-
            ${{ runner.os }}-openwrt-sdk-

      - name: Set build environment
        id: build-env
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Prefer an 8-character short SHA for artifact naming consistency
          resolved_sha="${GITHUB_SHA:-}"
          if [ -z "$resolved_sha" ]; then
            resolved_sha=$(git rev-parse HEAD 2> /dev/null || echo nogit)
          fi
          short_sha=$(echo "$resolved_sha" | cut -c1-8)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            build_name="pr-build"
          else
            build_name="main-build"
          fi
          {
            echo "BUILD_NAME=${build_name}"
            echo "SHORT_SHA=${short_sha}"
          } >> "$GITHUB_ENV"
          echo "Using BUILD_NAME=${build_name} (artifact suffix: +${short_sha})"

      - name: Prepare package structure for SDK
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Create the expected package structure for the SDK action
          mkdir -p feed/package
          cp -r package/openwrt-captive-monitor feed/package/
          # Create artifacts directory
          mkdir -p "artifacts/${BUILD_NAME}"

          # Ensure a placeholder feeds.conf.default exists for the SDK action to patch
          # The openwrt/gh-action-sdk action expects this file under FEED_DIR and will
          # inject the local src-link feed path at runtime. Upstream feeds are not required
          # for this package build.
          if [ ! -f feed/feeds.conf.default ]; then
            {
              echo "# Placeholder feeds.conf.default for SDK action"
              echo "# The action will inject: src-link ${FEEDNAME:-local} <resolved-path>"
            } > feed/feeds.conf.default
          fi

          echo "Prepared package structure:"
          find feed -type f -name "Makefile" | head -5

          # Initialize git repo in feed to avoid SDK format check errors
          cd feed
          git init
          git config user.email "ci@openwrt-captive-monitor"
          git config user.name "CI Bot"
          git add .
          git commit -m "Initial commit" || true
          cd ..


      - name: Build with OpenWrt SDK (${{ matrix.sdk_target }})
        uses: openwrt/gh-action-sdk@v9
        env:
