name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Makefile'
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      matrix:
        linter:
          - shfmt
          - shellcheck
          - markdownlint
          - actionlint
          - yamllint

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache linting tools
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/shfmt
            ~/.cache/shellcheck
            ~/.cache/actionlint
          key: >-
            ${{ runner.os }}-lint-tools-${{ matrix.linter }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-lint-tools-${{ matrix.linter }}-
            ${{ runner.os }}-lint-tools-

      - name: Install base dependencies
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar

      - name: Install linter dependencies
        if: matrix.linter == 'shfmt' || matrix.linter == 'shellcheck'
        uses: ./.github/actions/setup-system-packages
        with:
          packages: busybox shfmt shellcheck

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          check-latest: true

      - name: Show Node.js version
        run: node --version

      - name: Install yamllint
        if: matrix.linter == 'yamllint'
        uses: ./.github/actions/setup-system-packages
        with:
          packages: yamllint

      - name: Run yamllint
        if: matrix.linter == 'yamllint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          yamllint -d "{extends: relaxed, rules: {truthy: disable}}" \
            .github/workflows/ci.yml

      - name: Run shfmt
        if: matrix.linter == 'shfmt'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Exclude init.d scripts (tabs and OpenWrt-specific functions)
          # Skip temporary and build directories
          find . \( -name '*.sh' -o -type f -executable \) \
            -not -path '*/.git/*' \
            -not -path '*/tmp/*' \
            -not -path '*/.tmp/*' \
            -not -path '*/build/*' \
            -not -path '*/init.d/*' \
            -not -path '*/package/*/files/etc/init.d/*' | \
            xargs -r shfmt -d -s -i 4 -ci -sr

      - name: Run shellcheck
        if: matrix.linter == 'shellcheck'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Exclude .git and init.d scripts
          find . \( -path './.git' \
            -o -path './package/*/files/etc/init.d' \) -prune -o \
            -type f -name "*.sh" -print | \
            xargs -r shellcheck
          shellcheck openwrt_captive_monitor.sh

      - name: Run markdownlint
        if: matrix.linter == 'markdownlint'
        uses: DavidAnson/markdownlint-cli2-action@v22
        with:
          config: '.markdownlint.json'
          files: '**/*.md'

      - name: Download actionlint
        if: matrix.linter == 'actionlint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Download actionlint into the runner temp directory
          ACTIONLINT_VERSION="1.7.1"
          ACTIONLINT_DIR="${RUNNER_TEMP:-/tmp}/actionlint"
          mkdir -p "$ACTIONLINT_DIR"
          URL="https://github.com/rhysd/actionlint/releases/download"
          URL="${URL}/v${ACTIONLINT_VERSION}"
          URL="${URL}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$URL" | tar -xz -C "$ACTIONLINT_DIR"
          # Expose actionlint binary path via GITHUB_ENV
          echo "ACTIONLINT_BIN=${ACTIONLINT_DIR}/actionlint" >> "$GITHUB_ENV"

      - name: Run actionlint
        if: matrix.linter == 'actionlint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Lint workflow YAML files, ignore temp/build directories
          # .actionlintignore and -ignore patterns skip tmp/build trees
          "${ACTIONLINT_BIN}" -color -shellcheck= -pyflakes= \
            -ignore '.*\/tmp\/.*' \
            -ignore '.*\/\.tmp\/.*' \
            -ignore '.*\/build\/.*' \
            .github/workflows/*.yml

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache test dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/test-deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('tests/**') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-

      - name: Install test dependencies
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar busybox

      - name: Run test harness with BusyBox ash
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          busybox ash tests/run.sh

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: tests/_out/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

