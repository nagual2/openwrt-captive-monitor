name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Makefile'
  pull_request:
    branches:
      - main
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - 'package/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      matrix:
        linter:
          - shfmt
          - shellcheck
          - markdownlint
          - actionlint
          - yamllint

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache linting tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/shfmt
            ~/.cache/shellcheck
            ~/.cache/actionlint
          key: >-
            ${{ runner.os }}-lint-tools-${{ matrix.linter }}-
            ${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-lint-tools-${{ matrix.linter }}-
            ${{ runner.os }}-lint-tools-

      - name: Install base dependencies
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar

      - name: Install linter dependencies
        if: matrix.linter == 'shfmt' || matrix.linter == 'shellcheck'
        uses: ./.github/actions/setup-system-packages
        with:
          packages: busybox shfmt shellcheck

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          check-latest: true

      - name: Show Node.js version
        run: node --version

      - name: Install yamllint
        if: matrix.linter == 'yamllint'
        uses: ./.github/actions/setup-system-packages
        with:
          packages: yamllint

      - name: Run yamllint
        if: matrix.linter == 'yamllint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          yamllint -d "{extends: relaxed, rules: {truthy: disable}}" \
            .github/workflows/ci.yml

      - name: Run shfmt
        if: matrix.linter == 'shfmt'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Exclude init.d scripts (tabs and OpenWrt-specific functions)
          # Skip temporary and build directories
          find . \( -name '*.sh' -o -type f -executable \) \
            -not -path '*/.git/*' \
            -not -path '*/tmp/*' \
            -not -path '*/.tmp/*' \
            -not -path '*/build/*' \
            -not -path '*/init.d/*' \
            -not -path '*/package/*/files/etc/init.d/*' | \
            xargs -r shfmt -d -s -i 4 -ci -sr

      - name: Run shellcheck
        if: matrix.linter == 'shellcheck'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Exclude .git and init.d scripts
          find . \( -path './.git' \
            -o -path './package/*/files/etc/init.d' \) -prune -o \
            -type f -name "*.sh" -print | \
            xargs -r shellcheck
          shellcheck openwrt_captive_monitor.sh

      - name: Run markdownlint
        if: matrix.linter == 'markdownlint'
        uses: DavidAnson/markdownlint-cli2-action@v21
        with:
          config: '.markdownlint.json'
          files: '**/*.md'

      - name: Download actionlint
        if: matrix.linter == 'actionlint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Download actionlint into the runner temp directory
          ACTIONLINT_VERSION="1.7.1"
          ACTIONLINT_DIR="${RUNNER_TEMP:-/tmp}/actionlint"
          mkdir -p "$ACTIONLINT_DIR"
          URL="https://github.com/rhysd/actionlint/releases/download"
          URL="${URL}/v${ACTIONLINT_VERSION}"
          URL="${URL}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$URL" | tar -xz -C "$ACTIONLINT_DIR"
          # Expose actionlint binary path via GITHUB_ENV
          echo "ACTIONLINT_BIN=${ACTIONLINT_DIR}/actionlint" >> "$GITHUB_ENV"

      - name: Run actionlint
        if: matrix.linter == 'actionlint'
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Lint workflow YAML files, ignore temp/build directories
          # .actionlintignore and -ignore patterns skip tmp/build trees
          "${ACTIONLINT_BIN}" -color -shellcheck= -pyflakes= \
            -ignore '.*\/tmp\/.*' \
            -ignore '.*\/\.tmp\/.*' \
            -ignore '.*\/build\/.*' \
            .github/workflows/*.yml

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Cache test dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/test-deps
          key: ${{ runner.os }}-test-deps-${{ hashFiles('tests/**') }}
          restore-keys: |
            ${{ runner.os }}-test-deps-

      - name: Install test dependencies
        uses: ./.github/actions/setup-system-packages
        with:
          packages: binutils tar busybox

      - name: Run test harness with BusyBox ash
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          busybox ash tests/run.sh

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: tests/_out/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

  build-pr-package:
    name: Build PR Package
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: read

    # Use pre-built SDK Docker image from GHCR
    container:
      image: ghcr.io/${{ github.repository_owner }}/openwrt-sdk:23.05.5-x86-64-latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root

    strategy:
      fail-fast: false
      matrix:
        # Build once for arch-independent package (PKG_ARCH:=all)
        # Package contains only shell scripts and configs
        include:
          - openwrt_version: '23.05.5'
            target: 'x86'
            subtarget: '64'
            arch: 'all'
            sdk_slug: 'x86-64'
            sdk_target: 'x86/64'

    steps:
      - name: Retry pull SDK image if needed
        if: failure()
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          # Retry logic for pulling SDK image (up to 3 attempts)
          OWNER="${{ github.repository_owner }}"
          IMAGE="ghcr.io/${OWNER}/openwrt-sdk:23.05.5-x86-64-latest"
          MAX_RETRIES=3
          RETRY_DELAY=10

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES to pull image: $IMAGE"
            if docker pull "$IMAGE"; then
              echo "Successfully pulled image"
              exit 0
            fi

            if [ $i -lt $MAX_RETRIES ]; then
              echo "Pull failed, waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done

          echo "Failed to pull image after $MAX_RETRIES attempts"
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache feeds dependencies
        uses: actions/cache@v4
        with:
          path: |
            /opt/openwrt-sdk/feeds
            /opt/openwrt-sdk/dl
          key: >-
            ${{ runner.os }}-openwrt-feeds-${{ matrix.sdk_slug }}-
            ${{ matrix.openwrt_version }}-
            ${{ hashFiles('package/openwrt-captive-monitor/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-feeds-${{ matrix.sdk_slug }}-
            ${{ matrix.openwrt_version }}-
            ${{ runner.os }}-openwrt-feeds-${{ matrix.sdk_slug }}-

      - name: Set build environment
        id: build-env
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          # Use 8-character short SHA for artifact naming
          resolved_sha="${GITHUB_SHA:-}"
          if [ -z "$resolved_sha" ]; then
            resolved_sha=$(git rev-parse HEAD 2> /dev/null || echo nogit)
          fi
          short_sha=$(echo "$resolved_sha" | cut -c1-8)
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            build_name="pr-build"
          else
            build_name="main-build"
          fi
          {
            echo "BUILD_NAME=${build_name}"
            echo "SHORT_SHA=${short_sha}"
          } >> "$GITHUB_ENV"
          echo "BUILD_NAME=${build_name} (suffix: +${short_sha})"

      - name: Prepare package for SDK build
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          # SDK is already available in /opt/openwrt-sdk from the container
          cd /opt/openwrt-sdk

          # Copy package directly to SDK package directory
          cp -r "${{ github.workspace }}/package/openwrt-captive-monitor" package/

          # Configure build
          make defconfig

          echo "SDK prepared for building"

      - name: Build package with SDK
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          cd /opt/openwrt-sdk

          # Build the package
          make package/openwrt-captive-monitor/compile V=s

          # Create artifacts directory
          mkdir -p "${{ github.workspace }}/artifacts/${BUILD_NAME}"

          # Copy built packages to artifacts directory
          DEST="${{ github.workspace }}/artifacts/${BUILD_NAME}/"
          find bin/packages -name "openwrt-captive-monitor*.ipk" \
            -exec cp -v {} "$DEST" \;

          echo "Package built successfully"


      - name: List and validate produced artifacts
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi
          ART_DIR="artifacts/${BUILD_NAME}"
          echo "Artifacts directory: $ART_DIR"

          if [ ! -d "$ART_DIR" ]; then
            echo "ERROR: Artifact directory not found: $ART_DIR"
            exit 1
          fi

          ls -la "$ART_DIR"

          # Count .ipk files
          IPK_COUNT=$(find "$ART_DIR" -name "*.ipk" -type f | wc -l)
          echo "Found $IPK_COUNT .ipk files"

          if [ "$IPK_COUNT" -eq 0 ]; then
            echo "error: no .ipk files found in $ART_DIR" >&2
            exit 1
          fi

      - name: Verify package internals
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          # Find .ipk file in artifacts directory
          ART_PATH="${{ github.workspace }}/artifacts/${BUILD_NAME}"
          echo "Searching for package in artifacts/${BUILD_NAME}"
          find "$ART_PATH" -name "openwrt-captive-monitor_*.ipk" -type f
          IPK_FILE=$(find "$ART_PATH" \
            -name "openwrt-captive-monitor_*.ipk" -type f | head -1)

          if [ -z "$IPK_FILE" ]; then
            echo "error: no openwrt-captive-monitor package found" >&2
            echo "Available .ipk files:"
            find "$ART_PATH" -name "*.ipk" -type f | head -20
            exit 1
          fi

          echo "Verifying package: $IPK_FILE"
          cd "${{ github.workspace }}"
          ./scripts/verify_package.sh "$IPK_FILE"

      - name: Validate IPK version metadata
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          cd "${{ github.workspace }}"
          echo "=== Validating Version field in .ipk metadata ==="

          for IPK_FILE in artifacts/${BUILD_NAME}/*.ipk; do
            if [ ! -e "$IPK_FILE" ]; then
              echo "warning: no .ipk files found" >&2
              continue
            fi
            echo ""
            echo "Validating: $(basename "$IPK_FILE")"
            # Validate Version field (no suffix rules for CI builds)
            EVENT="${{ github.event_name }}"
            ./scripts/validate-ipk-version.sh "$IPK_FILE" "$EVENT"
          done
          echo ""
          echo "All packages validated successfully"

      - name: Stage package artifacts with SHA256SUMS
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          cd "${{ github.workspace }}"
          ./scripts/stage-package-artifacts.sh "artifacts/${BUILD_NAME}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: >-
            captive-monitor-${{ matrix.sdk_target }}-
            ${{ env.BUILD_NAME }}+${{ env.SHORT_SHA }}
          path: package
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: Build summary
        run: |
          set -eu
          if (set -o pipefail) 2> /dev/null; then
            # shellcheck disable=SC3040
            set -o pipefail
          fi

          cd "${{ github.workspace }}"
          {
            echo "## 📦 Build Summary"
            echo ""
            echo "**Build Method:** Docker SDK Image"
            OWNER="${{ github.repository_owner }}"
            SDK_IMAGE="ghcr.io/${OWNER}/openwrt-sdk:23.05.5-x86-64-latest"
            echo "**SDK Image:** ${SDK_IMAGE}"
            echo "**Target:** ${{ matrix.sdk_target }}"
            echo "**Architecture:** ${{ matrix.arch }}"
            echo "**OpenWrt Version:** ${{ matrix.openwrt_version }}"
            echo "**Short SHA:** ${{ env.SHORT_SHA }}"
            echo ""
            echo "### 📋 Generated Packages"
            find "artifacts/${BUILD_NAME}" -name "*.ipk" \
              -exec basename {} \; | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
