name: Build Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least-privilege default: no repository-wide write access.
permissions:
  contents: read

# Cancel in-progress runs for the same ref so duplicate tag pushes don't
# queue multiple concurrent package builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-deb:
    name: Build Debian package
    runs-on: ubuntu-24.04
    # Write access is granted only to this job so it can upload release assets.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y dpkg-dev

      - name: Make scripts executable
        run: |
          set -euo pipefail
          chmod +x debian/rules
          chmod +x debian/postinst
          chmod +x debian/prerm
          chmod +x scripts/build_deb.sh
          chmod +x scripts/update-version-metadata.sh
          chmod +x tools/captive_portal_wsl_selenium.py

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION | tr -d '\r\n')"
          if [ -z "$VERSION" ]; then
            echo "::error file=VERSION::VERSION file is empty or missing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Debian package for version: $VERSION"

      - name: Build Debian package
        run: |
          set -euo pipefail
          # dpkg-dev is already installed in the previous step
          bash scripts/build_deb.sh
        env:
          SKIP_APT_INSTALL: "1"

      - name: Verify built package exists
        run: |
          set -euo pipefail
          echo "Listing built packages:"
          ls -lh dist/deb/*.deb || {
            echo "::error::No .deb files found under dist/deb/ — build_deb.sh may have failed silently"
            exit 1
          }

      - name: Upload .deb package artifact
        uses: actions/upload-artifact@v5
        with:
          name: debian-package-${{ steps.version.outputs.version }}
          path: dist/deb/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
