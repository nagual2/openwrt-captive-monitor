name: Act Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check environment
        run: |
          echo "Testing act locally"
          echo "Current directory: $(pwd)"
          echo "User: $(whoami)"
          echo "OS: $(uname -a)"
          
      - name: List files
        run: |
          echo "Files in current directory:"
          ls -la
          
      - name: Test basic commands
        run: |
          echo "Testing basic shell commands"
          date
          echo "PATH: $PATH"